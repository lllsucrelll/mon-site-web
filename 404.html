<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Magomed Dautaev</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Mr+Dafoe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .lost { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px var(--gutter); position: relative; overflow: hidden; }
    .lost__code { font-family: var(--display); font-size: 42vw; line-height: .8; position: absolute; inset: 50% 0 auto; transform: translateY(-50%); pointer-events: none;
      background: linear-gradient(180deg, var(--red-hot), var(--red-deep)); -webkit-background-clip: text; background-clip: text; color: transparent; opacity: .25; }
    .lost__box { position: relative; }
    .lost__hello { font-family: var(--script); font-size: clamp(40px, 6vw, 64px); line-height: 1; transform: rotate(-4deg); }
    .lost h1 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(48px, 8vw, 110px); line-height: .95; margin: 10px 0 18px; }
    .lost p:not(.lost__hello) { color: var(--muted); margin-bottom: 30px; }
  </style>
</head>
<body>
  <main class="lost">
    <span class="lost__code" aria-hidden="true">404</span>
    <div class="lost__box">
      <p class="lost__hello">Oups…</p>
      <h1>Page <em>introuvable.</em></h1>
      <p>Cette page n'existe pas ou a déménagé.</p>
      <a href="/" class="btn btn--red">Retour à l'accueil <span aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
